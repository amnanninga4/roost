excluded:
  # Both forms: a bare `.build` only matches the one at the repo root, and the Swift
  # packages each grow their own once anyone runs `swift test`. Without the glob,
  # linting a tree that has been built reports 25 errors in generated code
  # (RoostCoreTests test_entry_point.swift) that do not exist in any source file.
  - .build
  - "**/.build"
  - DerivedData
  - .claude
  - "**/*.xcodeproj"
line_length:
  warning: 140
  error: 200
# swiftlint's default minimum of three characters fights idiomatic Swift
# (`e` in a catch, `m` for a mapper, `x`/`y` in geometry).
identifier_name:
  min_length: 1
  max_length: 60
  validates_start_with_lowercase: warning
# Flagged, never fatal: tests reach for try! on fixtures on purpose.
force_try:
  severity: warning
# Three-member tuples (an RGB triple, a fixture row) are fine; warn from four.
large_tuple:
  warning: 3
  error: 6
disabled_rules:
  - trailing_comma
  - todo
  # swiftformat owns brace placement; its wrapped-signature style trips this rule.
  - opening_brace
