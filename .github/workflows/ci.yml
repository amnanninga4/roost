name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. A new push supersedes the one in flight so macOS minutes are
# not spent on a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # server/ has no dependencies and uses the built-in node:sqlite, which
      # needs >= 22.13 (server/package.json engines). No npm cache: there is no
      # lockfile and nothing to install.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Node version
        run: node --version

      - name: npm test
        working-directory: server
        run: npm test

  app:
    name: app (Xcode 26, iPhone 17 Pro)
    # macos-26 is the arm64 macOS 26 Tahoe image and the current macos-latest.
    # Standard GitHub-hosted runners are free on public repos; the -xlarge and
    # -large labels are not, so do not "upgrade" this label.
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The macos-26 image ships Xcode 26.6 (default), 26.5, 26.4.1, 26.3, 26.2,
      # 26.1.1 and 26.0.1 under /Applications/Xcode_<version>.app. 26.6 is pinned
      # rather than left to /Applications/Xcode.app so an image default bump is a
      # deliberate edit here. (26.3 is what the Mac builds with today, if we ever
      # need CI and local to be byte-identical toolchains.)
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      # No SwiftPM cache: RoostCore and RoostDesign are local path packages with
      # no remote dependencies, so resolution fetches nothing over the network.
      - name: Install XcodeGen, SwiftFormat, SwiftLint
        run: |
          brew install xcodegen swiftformat swiftlint
          xcodegen --version
          swiftformat --version
          swiftlint version

      # Roost.xcodeproj is generated from Roost/project.yml and committed.
      # Regenerating must be a no-op; a diff means someone hand-edited the
      # pbxproj or forgot to run xcodegen after editing project.yml.
      - name: Regenerate the Xcode project
        working-directory: Roost
        run: xcodegen generate

      - name: Committed pbxproj matches project.yml
        run: git diff --exit-code Roost/Roost.xcodeproj/project.pbxproj

      # Fatal: PR #59 landed the baseline sweep, so the whole tree is clean and a
      # hit here is a file that missed the hook in .claude/hooks/swift-format.sh.
      - name: swiftformat --lint
        run: swiftformat --lint .

      # SwiftLint errors are fatal; warnings are not (no --strict). Whole tree:
      # the baseline has been 0 error-severity violations since the .swiftlint.yml
      # relax in PR #26 and the format sweep in PR #59.
      - name: swiftlint
        run: swiftlint lint --quiet .

      # The destination is a device NAME, not a UDID, so it only resolves if the image
      # actually has an iPhone 17 Pro. On 2026-09-14 a runner came up with none and
      # xcodebuild failed with "Unable to find a device matching the provided
      # destination specifier" after a full package resolve — a red build that had
      # nothing to do with the diff. Create it on the newest installed iOS runtime
      # when it is missing, and always print what we ended up with.
      - name: Ensure an iPhone 17 Pro simulator exists
        run: |
          set -o pipefail
          if xcrun simctl list devices available | grep -q 'iPhone 17 Pro ('; then
            echo "iPhone 17 Pro is already on this image."
          else
            echo "No iPhone 17 Pro on this image; creating one."
            runtime=$(xcrun simctl list runtimes available \
              | sed -n 's/.*\(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]*\).*/\1/p' \
              | sort -V | tail -1)
            if [ -z "$runtime" ]; then
              echo "::error::no iOS simulator runtime is installed on this runner" >&2
              xcrun simctl list runtimes
              exit 1
            fi
            echo "Using runtime $runtime"
            xcrun simctl create 'iPhone 17 Pro' \
              com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime"
          fi
          echo "Simulators the destination can resolve to:"
          xcrun simctl list devices available | grep 'iPhone 17 Pro (' | sed 's/^/  /'

      # iPhone 17 Pro is the device CLAUDE.md names for the local run, and the step
      # above guarantees the image has one. The app's deployment target is iOS 26,
      # well under any runtime the image ships. -skipPackagePluginValidation keeps
      # the local path packages from prompting about plugin trust on a fresh machine.
      - name: xcodebuild test
        run: |
          set -o pipefail
          # testShoppingScrollDeceleration records a scroll measurement and asserts nothing, so it
          # is not a gate — but it can still fail the job. Its signpost metric drops samples on a
          # loaded shared runner, and XCTest then fails on the inconsistent count ("Received
          # unexpected number of metrics: 0 in iteration with index 1") rather than on anything the
          # app did. It passed three for three locally the same morning it broke CI. The gate for
          # that list is testShoppingListStaysLazy, which counts cells and has no timing in it.
          xcodebuild \
            -project Roost/Roost.xcodeproj \
            -scheme Roost \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipPackagePluginValidation \
            -skip-testing:RoostUITests/ScrollPerformanceTests/testShoppingScrollDeceleration \
            test

  packages:
    name: packages (swift test)
    # The app job compiles both packages but never runs their tests: the Roost
    # scheme's test action is RoostTests and RoostUITests only (Roost/project.yml),
    # so RoostCore's scheduling rules and RoostDesign's palette are built and then
    # left unexercised. On 2026-09-14 a chores-data change broke six RoostCore tests
    # and CI stayed green, which is what this job is here to stop.
    # No `needs:` on purpose — the app job takes ~18 minutes and this must not queue
    # behind it.
    runs-on: macos-26
    # Both suites together take under a second; the budget here is checkout and
    # toolchain. Short enough that a hang is caught without spending what the app
    # job's 45 minutes allows for.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pinned for the same reason as the app job: `swift test` builds with whatever
      # toolchain xcode-select points at, so an image default bump would otherwise
      # change the Swift version under these tests without anyone editing this file.
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      # No SwiftPM cache, as in the app job: both packages are local paths with no
      # remote dependencies, so resolution fetches nothing over the network.
      - name: swift test RoostCore
        working-directory: Packages/RoostCore
        run: swift test

      # Runs even when RoostCore failed, so one red suite cannot hide the other.
      # This does not forgive anything: a failed step still fails the job, so one
      # run tells you the state of both packages.
      - name: swift test RoostDesign
        if: ${{ !cancelled() }}
        working-directory: Packages/RoostDesign
        run: swift test
